<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Task - TaskFlow</title>
    <link rel="stylesheet" href="../styles/style.css">
</head>

<body class="add-task-page">

<header class="add-task-header">
    <h1>TaskFlow</h1>

    <nav class="add-task-nav">
        <a href="index.html">Home</a>
        <a href="add-task.html" class="active">Add Task</a>
        <a href="completed-tasks.html">Completed Tasks</a>
        <a href="#">Task List</a>
        <a href="#">About</a>
    </nav>
</header>

<main class="add-task-main">

    <h2>Add New Task</h2>

    <form class="add-task-form" action="#" method="post">

        <label for="title">Task Title</label>
        <input type="text" id="title" name="title" required>

        <label for="description">Description</label>
        <textarea id="description" name="description" rows="5" required></textarea>

        <label for="date">Due Date</label>
        <input type="date" id="date" name="date" required>

        <label for="priority">Priority</label>
        <select id="priority" name="priority" required>
            <option value="">Select Priority</option>
            <option value="High">High</option>
            <option value="Medium">Medium</option>
            <option value="Low">Low</option>
        </select>

        <button type="submit">Add Task</button>

    </form>

</main>

<footer class="add-task-footer">
    <p>TaskFlow - Task Management Application</p>
</footer>

</body>
</html>
